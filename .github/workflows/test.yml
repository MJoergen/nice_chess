name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang, lld, and llvm
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Fetch nice_cpu, niceemu, and the test suites
        run: make deps
      - name: Test
        run: make test
      - name: Perft suite to depth 5
        run: make perft-deep
      - name: A full game in the windowed front end
        run: make screen-game
      - name: Against random moves
        run: make match-random
      - name: Size
        run: make size
