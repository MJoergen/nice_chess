name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang, lld, and llvm
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Fetch nice_cpu, niceemu, and the perft suite
        run: make deps
      - name: Test
        run: make test
      - name: Perft suite to depth 5
        run: make perft-deep
      - name: Size
        run: make size
